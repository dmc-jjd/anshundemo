[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "anshun-report-workbench-demo"
version = "0.1.0"
description = "Local Anshun monthly report evidence and template workbench"
requires-python = ">=3.13"
dependencies = ["fastapi==0.142.2", "pydantic==2.13.5", "langgraph==1.0.1", "uvicorn==0.41.0", "lxml==6.1.1", "python-multipart==0.0.32", "Pillow==12.2.0", "jsonschema==4.26.0", "matplotlib==3.11.2"]

[project.optional-dependencies]
test = ["pytest==9.0.3", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

