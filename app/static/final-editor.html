<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>康奈 · 洞研智台 — 终稿编辑</title>
<link rel="stylesheet" href="/static/style.css?v=20261114-redhead">
<style>
  html,body{height:100%}
  body{display:flex;flex-direction:column;overflow:hidden}
  .ed-bar{flex:0 0 auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap;
          padding:10px var(--pad-x);background:var(--bg);border-bottom:1px solid var(--line)}
  .ed-bar .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
  /* style.css 的全局 button{min-height:32px} 会把这里的 height:28px 顶到 32px
     （工具栏单行 52px）。这里把 28px 还原成实际生效值：点击区 28×28，
     正好是「不缩到 28px 以下」的下限，单行回到 48px。 */
  .ed-btn{height:28px;min-height:28px;min-width:28px;padding:0 7px;border-radius:var(--radius-sm);
          border:1px solid var(--line);background:var(--card);color:var(--ink);
          font-family:var(--font);font-size:12.5px;cursor:pointer;display:inline-flex;
          align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .ed-btn:hover{background:var(--field)}
  .ed-btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .ed-btn.primary:hover{background:var(--brand-deep);border-color:var(--brand-deep)}
  .ed-btn:disabled{opacity:.45;cursor:default}
  /* 按下态：只用底色 + 边框 + 字重（不加阴影/位移）。
     声明在 .ed-btn:hover 之后，且 .on:hover 单独再写一条高的选择器，
     保证悬停时按下态不会被 hover 的 background 冲掉。 */
  .ed-btn.on{background:var(--brand-bg);border-color:var(--brand);color:var(--brand-tx);font-weight:600}
  .ed-btn.on:hover{background:var(--brand-bg);border-color:var(--brand);color:var(--brand-tx)}
  .ed-spacer{flex:1 1 auto}
  .ed-main{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
           background:var(--bg);padding:14px 0 40px}
  .ed-note{display:flex;align-items:center;gap:10px;padding:0 var(--pad-x) 10px;
           font-size:11px;color:var(--faint);max-width:var(--page-max);margin:0 auto}
  .ed-note .sp{flex:1}
  .ed-stage{width:100%;max-width:var(--page-max);margin:0 auto;padding:0 var(--pad-x)}
  .ed-stage canvas{box-shadow:0 1px 2px rgba(20,20,19,.06)}
  /* 壳里 --page-max 是 100%，纸张默认贴着左边缘；这里只把 #ceContainer 的内容居中，
     不动壳的 token（style.css 不归本页管）。 */
  #ceContainer{display:flex;flex-direction:column;align-items:center}

  /* 左栏「历史生成报告」：固定 240px，右边是原来的工具栏 + 纸张（纸张在剩余空间居中）。
     工具栏 / 纸张自身的规则一个字没改，这里只负责把它们放进右侧那一列。 */
  .ed-shell{flex:1 1 auto;min-height:0;display:flex}
  .ed-aside{flex:0 0 240px;min-height:0;overflow-y:auto;overflow-x:hidden;
            box-sizing:border-box;padding:0 8px 10px;
            background:var(--card);border-right:1px solid var(--line)}
  .ed-body{flex:1 1 auto;min-width:0;min-height:0;display:flex;flex-direction:column}
  .ed-aside-title{font-size:11px;color:var(--faint);letter-spacing:.04em;
                  padding:12px 2px 6px}
  .ed-reports{display:flex;flex-direction:column;gap:2px}
  .ed-rep{position:relative;box-sizing:border-box;height:46px;padding:0 10px;border-radius:8px;
          display:flex;flex-direction:column;justify-content:center;cursor:pointer}
  .ed-rep:hover{background:var(--field)}
  .ed-rep.on{background:var(--field);box-shadow:inset 2px 0 0 var(--brand)}
  .ed-rep-name{font-size:12.5px;line-height:16px;color:var(--ink);padding-right:18px;
               white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ed-rep-meta{display:flex;gap:8px;font-size:11px;line-height:14px;color:var(--muted)}
  .ed-rep-meta .st{color:var(--faint)}
  .ed-rep-more{position:absolute;top:0;right:4px;width:20px;height:46px;padding:0;
               border:0;border-radius:6px;background:none;color:var(--faint);
               font-family:var(--font);font-size:14px;line-height:1;cursor:pointer}
  .ed-rep-more:hover{background:var(--field);color:var(--ink)}
  .ed-rep-menu{position:absolute;top:38px;right:4px;z-index:5;display:none;gap:4px;
               padding:4px;border:1px solid var(--line);border-radius:var(--radius-sm);
               background:var(--card);box-shadow:0 4px 14px rgba(20,20,19,.10)}
  .ed-rep.menu .ed-rep-menu{display:flex}
  .ed-rep-menu button{height:24px;padding:0 8px;border:1px solid var(--line);border-radius:6px;
                      background:var(--card);color:var(--ink);font-family:var(--font);
                      font-size:12px;cursor:pointer}
  .ed-rep-menu button:hover{background:var(--field)}
  .ed-rep-menu .del{color:var(--brand-tx);border-color:var(--brand)}
  .ed-rep-menu .del:hover{background:var(--brand-bg)}
  .ed-empty{font-size:13px;color:var(--faint);text-align:center;padding:28px 0}

  /* ── 工具栏「更多」菜单 ────────────────────────────────────────
     左栏 240px 之后右栏只剩 ~1200px，.ed-bar 的 flex-wrap 会把工具栏折成
     两行、把「保存到系统」挤下去。低频的 6 个命令收进最右侧「更多」，
     剩下的 17 个 + 更多回到一行；工具栏自身规则（.ed-btn 尺寸/按下态）不动。 */
  .ed-bar{position:relative}
  .ed-more-btn .ed-caret{flex:0 0 16px;width:16px;height:16px;transition:transform .16s ease}
  .ed-more-btn[aria-expanded="true"]{background:var(--field)}
  .ed-more-btn[aria-expanded="true"] .ed-caret{transform:rotate(180deg)}
  .ed-more{position:absolute;top:100%;right:var(--pad-x);z-index:30;display:none;
           box-sizing:border-box;width:168px;padding:4px 0;overflow:hidden;
           background:var(--card);border:1px solid var(--line);border-radius:10px;
           box-shadow:var(--shadow),0 4px 14px rgba(20,20,19,.10)}
  .ed-bar.more-open .ed-more{display:block}
  .ed-mi{display:flex;align-items:center;gap:6px;box-sizing:border-box;width:100%;
         height:34px;padding:0 10px;border:0;background:none;color:var(--ink);
         font-family:var(--font);font-size:13px;line-height:1;text-align:left;
         white-space:nowrap;cursor:pointer}
  .ed-mi .ic{flex:0 0 16px;width:16px;height:16px;color:var(--muted)}
  .ed-mi:hover{background:var(--field)}
  /* 菜单项按下态：与工具栏同一套 .on 契约（rangeStyleChange 驱动）。 */
  .ed-mi.on{background:var(--brand-bg);color:var(--brand-tx);font-weight:600}
  .ed-mi.on:hover{background:var(--brand-bg)}
  .ed-mi.on .ic{color:var(--brand-tx)}
  .ed-msep{height:1px;background:var(--line);margin:4px 0}
</style>
</head>

  <div class="ed-reports" id="edReports"></div>
</aside>
<div class="ed-body">

<div class="ed-bar">
