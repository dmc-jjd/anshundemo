<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>康奈 · 洞研智台 — 终稿编辑</title>
<link rel="stylesheet" href="/static/style.css?v=20261114-redhead">
<style>
  html,body{height:100%}
  body{display:flex;flex-direction:column;overflow:hidden}
  .ed-bar{flex:0 0 auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap;
          padding:10px var(--pad-x);background:var(--bg);border-bottom:1px solid var(--line)}
  .ed-bar .sep{width:1px;height:18px;background:var(--line);margin:0 4px}
  .ed-btn{height:28px;min-width:28px;padding:0 9px;border-radius:var(--radius-sm);
          border:1px solid var(--line);background:var(--card);color:var(--ink);
          font-family:var(--font);font-size:12.5px;cursor:pointer;display:inline-flex;
          align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .ed-btn:hover{background:var(--field)}
  .ed-btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .ed-btn.primary:hover{background:var(--brand-deep);border-color:var(--brand-deep)}
  .ed-btn:disabled{opacity:.45;cursor:default}
  .ed-spacer{flex:1 1 auto}
  .ed-main{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
           background:var(--bg);padding:14px 0 40px}
  .ed-note{display:flex;align-items:center;gap:10px;padding:0 var(--pad-x) 10px;
           font-size:11px;color:var(--faint);max-width:var(--page-max);margin:0 auto}
  .ed-note .sp{flex:1}
  .ed-stage{width:100%;max-width:var(--page-max);margin:0 auto;padding:0 var(--pad-x)}
  .ed-stage canvas{box-shadow:0 1px 2px rgba(20,20,19,.06)}
  /* 壳里 --page-max 是 100%，纸张默认贴着左边缘；这里只把 #ceContainer 的内容居中，
     不动壳的 token（style.css 不归本页管）。 */
  #ceContainer{display:flex;flex-direction:column;align-items:center}
</style>
</head>
<body>

<header class="topbar">
  <div class="crumb">
    <svg class="mark" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><g stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M12 3.2v17.6M3.2 12h17.6M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/></g></svg>
    <b>康奈 · 洞研智台</b><span class="sep">/</span><span class="here">终稿编辑</span>
  </div>
  <div class="topmeta">
    <span id="edTaskName">—</span>
    <span class="saved" id="edSaved" title="保存到系统的状态"><i aria-hidden="true"></i><span id="edSavedText">未保存</span></span>
    <span id="edStatus">就绪</span>
  </div>
</header>

<nav class="stage-progress" id="stageProgress" aria-label="五阶段">
  <div class="stage-pill">
    <button class="stage" type="button" data-state="done" onclick="location.href='/?view=overview'"><span class="idx">01</span><span class="nm">工作台</span><span class="dot" aria-hidden="true"></span></button>
    <button class="stage" type="button" data-state="done" onclick="location.href='/?view=template'"><span class="idx">02</span><span class="nm">模板确认</span><span class="dot" aria-hidden="true"></span></button>
    <button class="stage" type="button" data-state="done" onclick="location.href='/?view=report'"><span class="idx">03</span><span class="nm">数据处理</span><span class="dot" aria-hidden="true"></span></button>
    <button class="stage" type="button" data-state="done" onclick="location.href='/?view=tasks'"><span class="idx">04</span><span class="nm">模板/数据·审核</span><span class="dot" aria-hidden="true"></span></button>
    <button class="stage" type="button" data-state="current"><span class="idx">05</span><span class="nm">报告撰写</span><span class="dot" aria-hidden="true"></span></button>
  </div>
</nav>

<div class="ed-bar">
  <button class="ed-btn" data-cmd="executeUndo" title="撤销">撤销</button>
  <button class="ed-btn" data-cmd="executeRedo" title="重做">重做</button>
  <span class="sep"></span>
  <button class="ed-btn" data-cmd="executeBold" title="加粗"><b>B</b></button>
  <button class="ed-btn" data-cmd="executeItalic" title="斜体"><i>I</i></button>
  <button class="ed-btn" data-cmd="executeUnderline" title="下划线"><u>U</u></button>
  <button class="ed-btn" data-cmd="executeStrikeout" title="删除线"><s>S</s></button>
  <span class="sep"></span>
  <button class="ed-btn" data-size="-" title="字号减小">A−</button>
  <button class="ed-btn" data-size="+" title="字号增大">A+</button>
  <span class="sep"></span>
  <button class="ed-btn" data-align="left" title="左对齐">左</button>
  <button class="ed-btn" data-align="center" title="居中">中</button>
  <button class="ed-btn" data-align="right" title="右对齐">右</button>
  <button class="ed-btn" data-align="alignment" title="两端对齐">两端</button>
  <span class="sep"></span>
  <button class="ed-btn" data-title="first" title="标题一">H1</button>
  <button class="ed-btn" data-title="second" title="标题二">H2</button>
  <button class="ed-btn" data-title="p" title="正文">正文</button>
  <span class="sep"></span>
  <button class="ed-btn" data-list="ul" title="无序列表">• 列表</button>
  <button class="ed-btn" data-list="ol" title="有序列表">1. 列表</button>
  <button class="ed-btn" data-table="1" title="插入 3×3 表格">插表格</button>
  <span class="sep"></span>
  <button class="ed-btn" id="edLoadTpl" title="载入模板 docx">载入模板</button>
  <button class="ed-btn" id="edLoadDoc" title="载入已生成报告 docx">载入报告</button>
  <span class="ed-spacer"></span>
  <button class="ed-btn" data-cmd="executePrint" title="打印">打印</button>
  <button class="ed-btn primary" id="edSave" title="把当前稿件存回系统">保存到系统</button>
  <button class="ed-btn" id="edExport" title="导出 docx 到本地">导出 docx</button>
</div>

<div class="ed-main">
  <div class="ed-note"><span id="edMsg">—</span><span class="sp"></span></div>
  <div class="ed-stage"><div id="ceContainer"></div></div>
</div>

<script src="/static/vendor/canvas-editor.js?v=20261116b"></script>
<script src="/static/final-editor.js?v=20261116-cf"></script>
</body>
</html>
