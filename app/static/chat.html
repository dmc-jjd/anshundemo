<html lang="zh-CN" data-brand="A">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>智能对话 · 康奈 · 洞研智台</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%239B3A2C'/%3E%3C/svg%3E">
<style>
/* 视口锁（方案 B）：整页不滚动。顶栏 54 + 阶段条/边框 85 = 139，workspace 固定占满剩余高度，
   对话列自己内部滚动，deep-chat 影子 DOM 里的输入框因此常驻视口底部（不再随长回答滚出屏幕）。 */
html,body{height:100%;display:block;overflow:hidden}
body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13px;line-height:1.6}
svg.ico{display:block;width:16px;height:16px;flex:none}
img.kn{display:block;flex:none;width:auto;height:auto}
button,a{font-family:inherit}

/* ============ 工作区（固定占满视口剩余高度，页面不滚动） ============ */
.workspace{flex:1 1 auto;height:calc(100vh - 139px);min-height:0;display:flex;align-items:stretch;
  border-top:1px solid var(--line);background:var(--bg);overflow:hidden}

/* ---------- 左栏 240px（滚动时吸顶，高度与视口对齐） ---------- */
.sidebar{flex:0 0 240px;width:240px;display:flex;flex-direction:column;position:sticky;top:54px;
  height:calc(100vh - 139px);min-height:420px;padding:10px 12px 12px;background:var(--bg);
  border-right:1px solid var(--line);
  transition:flex-basis .18s ease,width .18s ease,padding .18s ease}
.sb-full{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;width:100%}
.sb-top{display:flex;align-items:center;gap:2px;height:38px;margin:0 0 10px;padding-left:3px;flex:none}
.sb-brand{display:inline-flex;align-items:center;text-decoration:none;flex:none;cursor:pointer}
.sb-brand img.kn{height:17.28px}
.sb-top .acts{margin-left:auto;display:flex;align-items:center;gap:1px}
.icobtn{width:28px;height:28px;display:grid;place-items:center;border:0;border-radius:7px;
  background:transparent;color:var(--muted);cursor:pointer;transition:background .12s ease,color .12s ease}
.icobtn:hover{background:var(--field);color:var(--ink)}
.icobtn:active{background:var(--line-soft)}
.sb-search{margin:0 0 8px;flex:none}
.sb-search[hidden]{display:none}
.sb-search input{width:100%;height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font:inherit;font-size:12.5px;outline:none;margin:0;min-height:0}
.sb-search input:focus{border-color:rgba(155,58,44,.32)}
.newchat{width:100%;height:38px;display:flex;align-items:center;justify-content:center;gap:6px;
  margin:0 0 8px;padding:0 10px;border-radius:100px;background:var(--card);
  border:1px solid var(--line);color:var(--ink);font-size:13px;letter-spacing:.01em;cursor:pointer;
  transition:border-color .14s ease,box-shadow .14s ease,background .14s ease}
.newchat .ico{width:16px;height:16px;color:var(--ink);opacity:.78}
.newchat:hover{border-color:rgba(155,58,44,.30);box-shadow:0 1px 2px rgba(155,58,44,.07)}
.sb-list{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding-top:2px}
.grp{display:flex;align-items:center;height:22px;margin-top:10px;padding:0 10px;flex:none}
.grp span{font-size:11px;letter-spacing:.04em;color:var(--faint)}
.grp-gear{margin-left:auto;width:18px;height:18px;display:grid;place-items:center;padding:0;
  border:0;border-radius:4px;background:transparent;color:#B5B0A6;cursor:pointer}
.grp-gear:hover{background:var(--field);color:var(--muted)}
.grp-gear .ico{width:16px;height:16px}
.conv{display:block;height:34px;line-height:34px;padding:0 10px;border-radius:8px;flex:none;
  font-size:13px;color:var(--ink);letter-spacing:.01em;text-decoration:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;cursor:pointer;
  transition:background .12s ease}
.conv:hover{background:var(--field);text-decoration:none}
.conv[aria-current="true"]{background:var(--field)}
.conv[aria-current="true"]::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:2px;
  border-radius:2px;background:var(--brand)}
.sb-list .none{padding:8px 10px;font-size:12px;color:var(--faint)}
.sb-foot{margin-top:auto;display:flex;align-items:center;gap:8px;height:40px;
  padding-top:10px;border-top:1px solid var(--line-soft);flex:none}
.avatar{width:22px;height:22px;flex:0 0 22px;border-radius:50%;background:var(--field);
  display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--muted)}
.sb-foot .who{font-size:12px;color:var(--muted);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-foot .k{font-size:10px;color:var(--faint);letter-spacing:.09em;margin-left:auto;flex:none}

/* 折叠态：60px 图标列 */
.sb-rail{display:none}
body.is-collapsed .sidebar{flex-basis:60px;width:60px;padding:10px 8px 12px}
body.is-collapsed .sb-full{display:none}
body.is-collapsed .sb-rail{display:flex;flex-direction:column;align-items:center;gap:6px;
  flex:1 1 auto;min-height:0;width:100%}
.sb-rail img.kn{height:17.28px;margin:3px 0 5px}
.railbtn{width:36px;height:34px;display:grid;place-items:center;padding:0;border:1px solid transparent;
  border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;transition:background .12s,color .12s}
.railbtn:hover{background:var(--field);color:var(--ink)}
.rail-divider{width:24px;height:1px;background:var(--line-soft);margin:4px 0;flex:none}
.rail-list{flex:1 1 auto;min-height:0;width:100%;overflow-y:auto;display:flex;flex-direction:column;
  align-items:center;gap:2px}
.rail-item{width:36px;height:32px;display:grid;place-items:center;padding:0;border:0;border-radius:8px;
  background:transparent;color:var(--muted);font-size:12px;cursor:pointer;position:relative;flex:none}
.rail-item:hover{background:var(--field);color:var(--ink)}
.rail-item[aria-current="true"]{background:var(--field);color:var(--ink)}
.rail-item[aria-current="true"]::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;
  border-radius:2px;background:var(--brand)}
.rail-avatar{margin-top:auto;flex:none}

/* ---------- 对话区（固定高度，内部滚动；输入框常驻底部） ---------- */
.chat{flex:1 1 auto;min-width:0;height:100%;min-height:0;display:flex;background:var(--card);position:relative}
.chat-slot{flex:1 1 auto;min-width:0;min-height:0;display:flex;overflow:hidden}
.chat-slot deep-chat{flex:1 1 auto;width:100%;min-width:0;min-height:0;height:100%;display:block}
.empty{position:absolute;left:0;right:0;top:0;bottom:120px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:0 40px;pointer-events:none}
.chat.has-thread .empty{display:none}
.empty .hero img.kn{height:40.16px;width:auto;display:block}
.empty h1{margin:26px 0 0;font-size:24px;font-weight:500;line-height:1.4;letter-spacing:.01em;
  color:var(--ink);text-align:center}
</style>
