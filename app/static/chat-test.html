<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>对话验证</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  body{background:var(--bg);color:var(--ink);font:14px/1.7 system-ui,-apple-system,"Microsoft YaHei",sans-serif}
  .chat-shell{max-width:820px;margin:0 auto;padding:28px 20px 148px;display:flex;flex-direction:column;min-height:100vh}
  .messages{display:flex;flex-direction:column;gap:18px;flex:1}
  .turn{display:flex;flex-direction:column;gap:10px}
  .bubble{padding:12px 14px;border-radius:var(--radius);border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);white-space:pre-wrap;word-break:break-word}
  .bubble.user{align-self:flex-end;max-width:min(78%,620px);background:var(--brand-bg);border-color:var(--brand);color:var(--ink)}
  .bubble.answer{white-space:pre-wrap}
  details.think{border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--field);color:var(--muted);font-size:12.5px}
  details.think summary{cursor:pointer;padding:7px 11px;list-style:none;color:var(--faint);user-select:none}
  details.think summary::-webkit-details-marker{display:none}
  details.think summary::before{content:'▸ ';transition:transform .15s}
  details.think[open] summary::before{content:'▾ '}
  details.think .think-text{padding:0 12px 10px;white-space:pre-wrap;word-break:break-word;line-height:1.65}
  .searchline{font-size:12.5px;color:var(--blue);background:var(--blue-bg);border:1px solid var(--line);border-radius:var(--radius-pill);padding:3px 11px;align-self:flex-start}
  .searchline.failed{color:var(--red);background:var(--red-bg)}
  .usage{font-size:12px;color:var(--faint);align-self:flex-start}
  .composer{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 20px}
  .composer-inner{max-width:820px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
  textarea{flex:1;resize:none;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--card);color:var(--ink);font:inherit;outline:none}
  textarea:focus{border-color:var(--brand)}
  button{padding:10px 18px;border:none;border-radius:var(--radius-sm);background:var(--brand);color:#fff;font:inherit;cursor:pointer}
  button:disabled{background:var(--faint);cursor:not-allowed}
</style>
</head>
<body>
<main class="chat-shell">
  <div id="messages" class="messages"></div>
  <form id="composer" class="composer" autocomplete="off">
    <div class="composer-inner">
      <textarea id="input" rows="2" placeholder="Enter 发送，Shift+Enter 换行"></textarea>
      <button id="send" type="submit">发送</button>
    </div>
  </form>
</main>
<script src="/static/chat-test.js"></script>
</body>
</html>
