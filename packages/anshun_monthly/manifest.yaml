package: anshun_monthly
report_type: 舆情月报
version: 1.0.0
template: template.json
prompts: prompts/
tools:
  allow:
    - import_records
    - filter_records
    - resolve_locality
    - propose_keyword_event_candidates
    - propose_vector_event_neighbors
    - group_events
    - calculate_metrics
    - classify_records
    - cluster_event_themes
    - discover_topics
    - select_materials
    - read_evidence
    - render_chart
    - build_table
    - parse_report_document
    - compare_report_structures
  phases:
    writing:
      - frozen_statistics
      - query_frozen_materials
      - plot_frozen_chart
      - search_historical_web
      - fetch_historical_page
  budgets:
    default: 40
    writing: 80
charts:
  pack: chart-core
  use: [sentiment, daily, platform, theme, locality]
skills:
  pack: skill-core
  use: [lieflat-less-ai-tone, source-binding]
