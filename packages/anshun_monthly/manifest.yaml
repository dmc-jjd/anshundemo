package: anshun_monthly
report_type: 舆情月报
version: 1.0.0
template: template.json
prompts: prompts/
tools:
  allow:
    - import_records
    - filter_records
    - resolve_locality
    - propose_keyword_event_candidates
    - propose_vector_event_neighbors
    - group_events
    - calculate_metrics
    - classify_records
    - cluster_event_themes
    - discover_topics
    - select_materials
    - read_evidence
    - render_chart
    - build_table
    - parse_report_document
    - compare_report_structures
  phases:
    writing:
      - frozen_statistics
      - query_frozen_materials
      - plot_frozen_chart
      - search_historical_web
      - fetch_historical_page
  budgets:
    default: 40
    writing: 80
charts:
  pack: chart-core
  use: [sentiment, daily, platform, theme, locality]
skills:
  pack: skill-core
  use: [lieflat-less-ai-tone, source-binding]

# 方案 B：声明本客户需要哪些产物；基座据此把 tools.allow 收窄成可达工具集。
# 不写这段 = 不剪枝（沿用 tools.allow 原样）；写全 = 行为与剪枝前一致。
# 把某项删掉，对应工具就调不动了（tool_not_allowed），而不是靠一段 if 决定流程。
capabilities:
  require: [records, metrics, locality, charts, events, documents]

# 可插拔能力：基座只按声明执行，不认识具体客户。
# 三层语义分工（别混）：
#   capabilities.require   → 这份报告「要哪些产物」（决定工具能不能进白名单）
#   features.<能力>.enabled → 某个能力「开不开」（false 时整组工具退出白名单）
#   参数（阈值/词典/区县表）→ 一律在 template.json，**不在本文件重复**
# stages 是**有序降级链**：前一级判不出（低置信 / 判为新簇）才进下一级。
# 现在没有微调模型，所以 bge 与 llm 均 enabled: false，行为与改造前完全一致。
features:
  # locality 只有一个开关：enabled 控制 resolve_locality 是否留在工具白名单。
  # 更细的属地口径（八区县表、报告地域名、官方域名白名单、证据校验）是客户规则，
  # 家分别在 app/section_two.py（validate_history/forecast_window）与 template.json，
  # 不在本文件重复声明。早先这里复写的 require_unique / evidence_check /
  # region_label / domain_allowlist 四个键全仓零消费者——删掉，不留第二次"假开关"。
  locality:
    enabled: true
  event_classification:
    enabled: true
    stages:
      - kind: bge
        enabled: false
        confidence_threshold: 0.75
      - kind: dictionary
        enabled: true
        confidence_threshold: 0.0
      - kind: llm
        enabled: false
  dedup:
    enabled: true
    # 阈值与代表策略都不在这里写：
    #   阈值    → template.json 的 data_contract.dedup（唯一真相）
    #   代表策略 → 代码固定为「只与不可变代表比、防链式」（core/tools/dedup.py）
    # 早先这里还写过一个 representative: immutable_first，全仓零消费者 ——
    # 那是「描述」不是「开关」，留着会让人以为改了有用，一并删掉。
