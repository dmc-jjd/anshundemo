package: anshun_monthly
report_type: 舆情月报
version: 1.0.0
template: template.json
prompts: prompts/

# 角色清单（声明式调度）：本客户参与哪些角色。
# 不写这段 = 全部角色参与（向后兼容，老包不炸）；写了 = 只有列出的角色参与，
# 未列出角色驱动的流程步骤整段跳过（角色→步骤的映射在 core/agent_steps.py）。
# 角色 id 必须存在于 prompts/roles.yaml，否则启动即失败 manifest_unknown_agent:<id>。
agents:
  - template_analyst
  - data_processor
  - event_judge
  - event_classifier
  - event_summarizer
  - writer
  - historical_researcher
  - format_reviewer
  - content_reviewer
tools:
  allow:
    - import_records
    - filter_records
    - resolve_locality
    - propose_keyword_event_candidates
    - propose_vector_event_neighbors
    - group_events
    - calculate_metrics
    - classify_records
    - cluster_event_themes
    - discover_topics
    - select_materials
    - read_evidence
    - render_chart
    - build_table
    - parse_report_document
    - compare_report_structures
  phases:
    writing:
      - frozen_statistics
      - query_frozen_materials
      - plot_frozen_chart
      - search_historical_web
      - fetch_historical_page
  budgets:
    default: 40
    writing: 80
charts:
  pack: chart-core
  use: [sentiment, daily, platform, theme, locality]
skills:
  pack: skill-core
  use: [lieflat-less-ai-tone, source-binding]

# 方案 B：声明本客户需要哪些产物；基座据此把 tools.allow 收窄成可达工具集。
# 不写这段 = 不剪枝（沿用 tools.allow 原样）；写全 = 行为与剪枝前一致。
# 把某项删掉，对应工具就调不动了（tool_not_allowed），而不是靠一段 if 决定流程。
capabilities:
  require: [records, metrics, locality, charts, events, documents]

# 可插拔能力：基座只按声明执行，不认识具体客户。
# 三层语义分工（别混）：
#   capabilities.require   → 这份报告「要哪些产物」（决定工具能不能进白名单）
#   features.<能力>.enabled → 某个能力「开不开」（false 时整组工具退出白名单）
#   参数（阈值/词典/区县表）→ 一律在 template.json，**不在本文件重复**
# stages 是**有序降级链**：前一级判不出（低置信 / 判为新簇）才进下一级。
# 现在没有微调模型，所以 bge 与 llm 均 enabled: false，行为与改造前完全一致。
features:
  # locality 只有一个开关：enabled 控制 resolve_locality 是否留在工具白名单。
  # 更细的属地口径（八区县表、报告地域名、官方域名白名单、证据校验）是客户规则，
  # 家分别在 app/section_two.py（validate_history/forecast_window）与 template.json，
  # 不在本文件重复声明。早先这里复写的 require_unique / evidence_check /
  # region_label / domain_allowlist 四个键全仓零消费者——删掉，不留第二次"假开关"。
  locality:
    enabled: true
  event_classification:
    enabled: true
    stages:
      - kind: bge
        enabled: false
        confidence_threshold: 0.75
      - kind: dictionary
        enabled: true
        confidence_threshold: 0.0
      - kind: llm
        enabled: false
  dedup:
    enabled: true
    # 阈值与代表策略都不在这里写：
    #   阈值    → template.json 的 data_contract.dedup（唯一真相）
    #   代表策略 → 代码固定为「只与不可变代表比、防链式」（core/tools/dedup.py）
    # 早先这里还写过一个 representative: immutable_first，全仓零消费者 ——
    # 那是「描述」不是「开关」，留着会让人以为改了有用，一并删掉。
  # 以下两项是客户级硬开关：与模板级 rules.features **相与**，包级关 = 这个客户永远不做，
  # 模板级再怎么开都当作关（合并点在 app/workflow.py `_template_features`）。
  # 工具侧消费者是 core/tools/registry.py:FEATURE_TOOLS（first_warning 无专属工具：
  # 预警只是 filter_records 的一个共用 scope；top10 对应 select_materials）。
  # 段落侧：关掉后对应段落整段不生成（确认模板时由模板级开关删段；包级关时事实里不产出
  # top10 / first_section_warning_event_count）。
  first_warning:
    enabled: true
  top10:
    enabled: true

# 无模型保底计划与建任务事件范围：从基座硬编码迁入本包，步骤顺序和产物名保持原样。
fallback:
  version: anshun-colored-fallback-v1
  steps:
    - import_records
    - calculate_metrics
    - filter_positive_scope
    - filter_neutral_scope
    - filter_records
    - filter_warning_scope
    - filter_union_scope
    - resolve_locality
    - group_events
    - classify_records
    - cluster_event_themes
    - discover_topics
    - select_materials
  goal_by_step:
    calculate_metrics: [B17_sentiment_peak, B26_platform]
    filter_positive_scope: [positive_record_scope]
    filter_neutral_scope: [neutral_record_scope]
    filter_records: [negative_record_scope]
    filter_warning_scope: [warning_record_scope]
    filter_union_scope: [B30_categories_districts_top10]
    group_events: [B30_event_groups]
    cluster_event_themes: [B30_categories]
    resolve_locality: [B30_districts]
    select_materials: [B30_top10_candidates]
event_scope:
  default: negative_or_warning
  confirmed: true
  applies_to: first_section_four_categories_districts_top10
  authority: user_confirmed_2026_11_06

# 内置槽位/五色模板：从基座 BASELINE_TEMPLATE 迁入本包。仅本包模板库展示该条目。
templates:
  builtin:
    - id: anshun-monthly-colored
      engine: slot_template
      name: 安顺月报 · 五色逐项占位模板
      version: 1
      status: candidate_requires_review
      usable_for_final: false
      reason: 8 月标色 Word 已取得，颜色疑点与占位符口径待人工确认
      manifest_url: /api/template-manifest

# 版式文件仍放在宿主 templates/anshun_monthly/，此处只声明文件名与下载名，不搬迁 docx。
layout:
  docx: template-with-placeholders.docx
  manifest: report.template.json
  source_docx: source-2026-08.docx
  download_name: 安顺月报五色占位模板.docx
