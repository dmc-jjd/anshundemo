template_policy:
  fixed_text: 语义稳定且不随月份数据变化；相同文本仅为证据
  semantic_units: 完整列表、标题、句子、分析段；禁止字符级槽位
  recommendations:
    min_items: 4
    max_items: 5
    structure: 比较5—8类候选，研究目标5类由本地历史、官方季节资料或已核实地方活动、明确模型季节机制支持的合格选题，至少4类方可进入写作；输出4—5类未来1—2个月风险预警与针对性措施，不得编造地方事实或引用
  top10:
    scope: negative_and_warning
    unit: deduplicated_event
    ranking: negative_warning_member_count
    summary_min_chars: 15
    summary_max_chars: 35
  review_controls:
    first_warning_scope: 已有独立审核表单，由人选择，字段遵循该选择；不要重复生成问题
  question_policy: 仅真实且未被规则处理的业务冲突；工具缺口及常规模板设计不是人工问题
report_prompt_profiles:
  anshun_monthly: {}
default_prompt_profile: anshun_monthly
