        - 县政府
        - 县人大
        - 县政协
        - 县领导
        - 调研
        - 部署
        - 召开会议
        deduplicate_selection: true
        selection_dedup_threshold: 0.9
    feature_overrides:
      dedup: true
    note: 用户确认：仅龙川本地正面政务活动；媒体按机构合并跨平台账号；官媒全量990条，地方并入区县级。逐行校验：全国152、省级446、市级360、区县级31，另蛇口电视台1条源级别为其他；地方391条，不自行把其他改为地方。后续新任务去重开启，旧任务与确认模板不改。媒体机构别名表需业务复核。
      侧聊确认更新：机构以作者为主、空值以同一行来源信息兜底；已知机构加地区/栏目后缀归并本名，羊城派及其河源/综合栏目均归羊城派；报道明细不减少。
